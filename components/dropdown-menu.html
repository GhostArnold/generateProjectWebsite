<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Menu</title>
    <link rel="stylesheet" href="dropdown-menu.css">
</head>
<body>
    <div class="container">
        <div class="dropdown-section">
            <button class="dropdown-btn">Кнопка 1 (11 элементов)</button>
            <div class="dropdown-content">
                <div class="item">
                    <img src="placeholder1.jpg" alt="Изображение 1">
                    <p>Описание элемента 1</p>
                </div>
                <!-- Повторить для остальных 10 элементов -->
            </div>
        </div>

        <div class="dropdown-section">
            <button class="dropdown-btn">Кнопка 2 (2 элемента)</button>
            <div class="dropdown-content">
                <div class="item">
                    <img src="placeholder12.jpg" alt="Изображение 12">
                    <p>Описание элемента 12</p>
                </div>
                <div class="item">
                    <img src="placeholder13.jpg" alt="Изображение 13">
                    <p>Описание элемента 13</p>
                </div>
            </div>
        </div>

        <div class="dropdown-section">
            <button class="dropdown-btn">Кнопка 3 (3 элемента)</button>
            <div class="dropdown-content">
                <div class="item">
                    <img src="placeholder14.jpg" alt="Изображение 14">
                    <p>Описание элемента 14</p>
                </div>
                <div class="item">
                    <img src="placeholder15.jpg" alt="Изображение 15">
                    <p>Описание элемента 15</p>
                </div>
                <div class="item">
                    <img src="placeholder16.jpg" alt="Изображение 16">
                    <p>Описание элемента 16</p>
                </div>
            </div>
        </div>
    </div>
    <script src="dropdown-menu.js"></script>
</body>
</html>
